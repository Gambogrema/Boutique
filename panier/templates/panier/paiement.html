<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Paiement - Ma Boutique</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            color: #222;
        }

        header {
            background: #111827;
            color: white;
            text-align: center;
            padding: 20px;
        }

        header h2 {
            margin: 0;
        }

        .container {
            max-width: 550px;
            margin: 30px auto;
            padding: 15px;
        }

        .carte {
            background: white;
            padding: 25px 20px;
            border-radius: 14px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.10);
        }

        .icone {
            text-align: center;
            font-size: 55px;
        }

        h1 {
            text-align: center;
            margin-bottom: 10px;
        }

        .numero {
            text-align: center;
            color: #6b7280;
        }

        .total {
            background: #f3f4f6;
            padding: 18px;
            border-radius: 10px;
            margin: 20px 0;
            text-align: center;
            font-size: 22px;
            font-weight: bold;
        }

        .label {
            display: block;
            margin: 18px 0 8px;
            font-weight: bold;
        }

        .choix {
            display: flex;
            gap: 10px;
        }

        .choix label {
            flex: 1;
            cursor: pointer;
        }

        .choix input {
            display: none;
        }

        .operateur {
            display: block;
            padding: 15px 10px;
            border: 2px solid #e5e7eb;
            border-radius: 10px;
            text-align: center;
            font-weight: bold;
        }

        .choix input:checked + .operateur {
            border-color: #16a34a;
            background: #f0fdf4;
        }

        .telephone {
            width: 100%;
            padding: 14px;
            border: 1px solid #d1d5db;
            border-radius: 9px;
            font-size: 16px;
        }

        .bouton {
            display: block;
            width: 100%;
            margin-top: 20px;
            border: none;
            text-decoration: none;
            color: white;
            background: #16a34a;
            padding: 15px;
            border-radius: 9px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .annuler {
            display: block;
            margin-top: 15px;
            text-align: center;
            color: #2563eb;
            text-decoration: none;
        }

        @media (max-width: 500px) {
            .container {
                margin: 15px auto;
                padding: 10px;
            }

            .carte {
                padding: 22px 16px;
            }

            .choix {
                flex-direction: column;
            }
        }
    </style>
</head>

<body>

<header>
    <h2>🛍️ Ma Boutique</h2>
</header>

<div class="container">

    <div class="carte">

        <div class="icone">
            💳
        </div>

        <h1>Paiement</h1>

        <p class="numero">
            Commande #{{ commande.id }}
        </p>

        <p>
            Bonjour <strong>{{ commande.nom }}</strong>,
        </p>

        <p>
            Choisissez votre moyen de paiement.
        </p>

        <div class="total">
            💰 {{ commande.total }} FCFA
        </div>

        <form method="post">

            {% csrf_token %}

            <label class="label">
                Moyen de paiement
            </label>

            <div class="choix">

                <label>
                    <input
                        type="radio"
                        name="moyen_paiement"
                        value="mtn"
                        required>
                    <span class="operateur">
                        🟡 MTN Mobile Money
                    </span>
                </label>

                <label>
                    <input
                        type="radio"
                        name="moyen_paiement"
                        value="orange"
                        required>
                    <span class="operateur">
                        🟠 Orange Money
                    </span>
                </label>

            </div>

            <label class="label" for="telephone">
                Numéro de téléphone
            </label>

            <input
                class="telephone"
                type="tel"
                id="telephone"
                name="telephone"
                placeholder="Exemple : 6XXXXXXXX"
                required>

            <button class="bouton" type="submit">
                🟢 Simuler le paiement
            </button>

        </form>

        <a
            class="annuler"
            href="{% url 'commande_confirmation' commande.id %}">
            ← Retour à la commande
        </a>

    </div>

</div>

</body>
</html>
